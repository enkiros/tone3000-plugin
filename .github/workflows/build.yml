# TONE3000 Plugin - Multi-platform build
# Builds VST3, Standalone, AU (macOS), and AAX (macOS/Windows, PACE-signed
# when secrets are configured) on macOS, Windows, and Linux, plus the UI
# testbed whose self-tests run next to the DSP suite. macOS is universal via
# per-arch builds + lipo, since dual -arch clang invocations are not
# sccache-cacheable.

name: Build Plugin

# Dispatch only. A signed three-platform run (notarization, PACE, Azure)
# is too expensive to fire on every PR. Restrict the `builds` environment
# to required reviewers if you want an admin gate before a runner starts.
on:
  workflow_dispatch:

# Least-privilege GITHUB_TOKEN: nothing in this workflow writes back to the
# repo (artifact upload and the sccache/actions cache use the runtime token,
# not this one).
permissions:
  contents: read

env:
  BUILD_TYPE: Release

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runs-on }}
    environment: builds
    env:
      # Publishable key (OAuth client_id), from the "builds" environment
      # secrets. Read at CMake configure by plugin/ui/NativeUi.cmake into
      # T3kConfig.h.
      T3K_PUBLISHABLE_KEY: ${{ secrets.T3K_PUBLISHABLE_KEY }}
      # Startup update check. Sourced from the environment, not hardcoded,
      # so a clone without that secret falls back to the code default of
      # off and never pings tone3000.com.
      T3K_UPDATE_NOTICE: ${{ secrets.T3K_UPDATE_NOTICE }}
      # Compiler cache (see "Setup sccache" step below); persists compiled
      # object results across runs via the GitHub Actions cache backend.
      SCCACHE_GHA_ENABLED: "true"
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux aarch64
            runs-on: ubuntu-24.04-arm
            os: linux
            arch: aarch64

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false

      # Two third-party submodules (AudioDSPTools and NeuralAmpModelerCore)
      # pin a nested eigen submodule to https://gitlab.com/libeigen/eigen at a
      # commit that is not the tip of any branch/tag (6d829e76). A shallow
      # recursive clone can't reach it, falls back to a direct-SHA fetch, and
      # GitLab refuses that ("remote error: GitLab is currently unable to
      # handle this request due to load"). actions/checkout's built-in
      # submodule handling does exactly that and does not retry, so the whole
      # job dies here before it ever configures or compiles.
      #
      # Init submodules ourselves instead: rewrite the gitlab eigen URL to a
      # GitHub mirror (GitHub allows fetching reachable SHAs), and retry the
      # update to absorb any remaining transient network failures. The
      # --depth=1 flag is deliberately omitted so a pinned non-tip commit is
      # always reachable through normal history.
      - name: Init submodules
        shell: bash
        run: |
          set -euo pipefail
          git config --global url."https://github.com/eigenteam/eigen-git-mirror".insteadOf \
            "https://gitlab.com/libeigen/eigen"
          git submodule sync --recursive
          for attempt in 1 2 3 4 5; do
            if git submodule update --init --recursive; then
              exit 0
            fi
            echo "submodule update failed (attempt ${attempt}); retrying in 10s..."
            sleep 10
          done
          echo "submodule update failed after 5 attempts" >&2
          exit 1

      # Single source of truth: the repo-root VERSION file (CMake and the
      # packaging scripts read it directly; CI exports it for the steps that
      # can't).
      - name: Read version
        shell: bash
        run: echo "T3K_VERSION=$(tr -d '[:space:]' < VERSION)" >> "$GITHUB_ENV"

      # Compiler cache: reuses object-file compilation results from previous
      # runs (keyed on compiler input, not source paths), so unchanged JUCE /
      # NAM / plugin translation units are skipped on the next run instead of
      # being recompiled from scratch. Uses the GitHub Actions cache backend
      # (SCCACHE_GHA_ENABLED above), no manual actions/cache wiring needed.
      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.11

      # CPM (see cmake/cpm.cmake) clones JUCE / GoogleTest / clap-juce-extensions
      # into libs/ on first configure. Caching that directory means CI skips
      # the git clone (and, for JUCE, the CMakeLists.txt source patches re-run
      # but no-op immediately since they're guarded by idempotency markers)
      # whenever the pinned versions haven't changed. Key includes matrix.os
      # since restored paths/line-endings/permissions shouldn't cross platforms.
      - name: Cache CPM dependencies
        uses: actions/cache@v4
        with:
          path: |
            libs/juce
            libs/googletest
            libs/clap-juce-extensions
          key: cpm-deps-${{ matrix.os }}-${{ hashFiles('CMakeLists.txt', 'plugin/CMakeLists.txt') }}

      - name: Install Linux dependencies
        if: matrix.os == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            pkg-config \
            libgtk-3-dev \
            libasound2-dev \
            libjack-jackd2-dev \
            libcurl4-openssl-dev \
            libfreetype6-dev \
            libx11-dev \
            libxcomposite-dev \
            libxcursor-dev \
            libxi-dev \
            libxinerama-dev \
            libxrandr-dev \
            libxrender-dev \
            xvfb

      - name: Configure CMake (Linux)
        if: matrix.os == 'linux'
        run: |
          cmake -B build -S . \
            -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} \
            -DCMAKE_TOOLCHAIN_FILE=cmake/linux-toolchain.cmake \
            -DBUILD_AAX=OFF \
            -DT3K_BUILD_UI_TESTBED=ON \
            -DT3K_TOUCH_UI=ON \
            -DCMAKE_C_COMPILER_LAUNCHER=sccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=sccache

      - name: Build plugin (Linux)
        if: matrix.os == 'linux'
        run: cmake --build build --config ${{ env.BUILD_TYPE }} --parallel 2

      # The default build already compiles DspTests (registered with ctest),
      # so running the suite costs seconds. macOS runs the native arm64 build.
      - name: Run DSP tests (Linux / Windows)
        if: matrix.os != 'macos'
        run: ctest --test-dir build/test --output-on-failure

      # The native UI's pure-logic unit tests (plugin/ui/testbed/SelfTests.cpp:
      # parsers, wrapping, OAuth/PKCE, token refresh, the connection gate).
      # The testbed is a JUCE GUI app, so Linux gives it a virtual display.
      - name: Run UI self-tests (Linux)
        if: matrix.os == 'linux'
        run: xvfb-run -a ctest --test-dir build/plugin/ui/testbed --output-on-failure

      # Linux: tarball with install script (the usual convention on Linux).
      - name: Package tarball (Linux)
        if: matrix.os == 'linux'
        run: |
          set -euo pipefail
          PKG="TONE3000-v${T3K_VERSION}-${{ matrix.os }}-${{ matrix.arch }}"
          ARTEFACTS="build/plugin/TONE3000_artefacts/${{ env.BUILD_TYPE }}"
          STAGE="build/${PKG}"
          mkdir -p "$STAGE"
          cp -r "$ARTEFACTS/VST3/TONE3000.vst3" "$STAGE/"
          cp -r "$ARTEFACTS/LV2/TONE3000.lv2" "$STAGE/"
          cp "$ARTEFACTS/CLAP/TONE3000.clap" "$STAGE/"
          cp "$ARTEFACTS/Standalone/TONE3000" "$STAGE/"
          install -m 755 script/installer/linux/install.sh "$STAGE/install.sh"
          install -m 644 script/installer/linux/README.txt "$STAGE/README.txt"
          install -m 644 script/installer/linux/tone3000.png "$STAGE/tone3000.png"
          if compgen -G "resources/factory-presets/*.t3kpreset" > /dev/null; then
            mkdir -p "$STAGE/factory-presets"
            cp resources/factory-presets/*.t3kpreset "$STAGE/factory-presets/"
          fi
          tar -czf "build/${PKG}.tar.gz" -C build "$PKG"
          echo "Created build/${PKG}.tar.gz"

      - name: Upload artifacts (Linux)
        if: matrix.os == 'linux' && success()
        uses: actions/upload-artifact@v4
        with:
          name: TONE3000-v${{ env.T3K_VERSION }}-${{ matrix.os }}-${{ matrix.arch }}
          path: build/TONE3000-v*-${{ matrix.os }}-${{ matrix.arch }}.tar.gz
          if-no-files-found: error
